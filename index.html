<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#0e9f6e" />
  <!-- 2026-08-16 根治 vivo/iQOO 系统 WebView 缓存（终极版）：HTML meta no-cache + Service Worker 自动清 + CacheStorage 自动清 + URL 加唯一 ?v= 时间戳 -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- 强清 SW + CacheStorage + URL 时间戳（运行时内联，不依赖外部资源） -->
  <script>
  (function(){
    try {
      var href = location.href.split('#')[0];
      if (location.search.indexOf('v=') < 0) {
        // 第一次访问：清缓存后用唯一 ?v= 时间戳 reload 自身
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(rs){
            rs.forEach(function(r){ try { r.unregister(); } catch(_){} });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(ks){
            ks.forEach(function(k){ caches.delete(k); });
          });
        }
        location.replace(href + (href.indexOf('?')>=0?'&':'?') + 'v=' + Date.now() + '-' + Math.random().toString(36).slice(2,8));
        return;
      }
      // 后续访问：再次确认 SW 已被清（连续 3 次兜底）
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(rs){
          if (rs.length) rs.forEach(function(r){ try { r.unregister(); } catch(_){} });
        });
      }
    } catch(e) {}
  })();
  </script>
  <!-- P3 问题1：iOS 全屏/添加到主屏幕支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="生酮打卡" />
  <meta name="apple-touch-fullscreen" content="yes" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="img/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div class="topbar">
      <h1>生酮饮食打卡</h1>
      <div class="topbar-right">
        <span class="mode-badge" id="modeBadge">生酮</span>
      </div>
    </div>

    <!-- A 打卡页：默认渲染一段最小骨架，绝不空白（v2.2.2 根治：onShow 任何时序失败时，用户至少能看到占位） -->
    <section class="view active" id="view-checkin">
      <div class="boot-skeleton">
        <div class="boot-spin"></div>
        <div class="boot-msg">正在加载打卡页…</div>
        <div class="boot-sub" id="bootSub">如长时间停留，请点下方「重新加载」</div>
        <button type="button" class="btn sm boot-retry" id="bootRetry" style="margin-top:14px;display:none">重新加载</button>
      </div>
    </section>
    <!-- B 记录页 -->
    <section class="view" id="view-records"></section>
    <!-- C 趋势页 -->
    <section class="view" id="view-trend"></section>
    <!-- D 我的页 -->
    <section class="view" id="view-mine"></section>
    <!-- E 分析页 -->
    <section class="view" id="view-analysis"></section>
    <!-- F 食谱页 -->
    <section class="view" id="view-recipes"></section>

    <nav class="tabbar" id="tabbar">
      <button data-view="checkin" class="active"><span class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.7 1.3 3 3 3s3-1.3 3-3V2"/><path d="M6 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg></span>打卡</button>
      <button data-view="records"><span class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>记录</button>
      <button data-view="trend"><span class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span>趋势</button>
      <button data-view="mine"><span class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>我的</button>
      <button data-view="analysis"><span class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></span>分析</button>
      <button data-view="recipes"><span class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>食谱</button>
    </nav>
  </div>

  <!-- P3 安装横幅（Android 可点安装；iOS 展示引导） -->
  <div id="installBar" class="install-bar">
    <span class="install-ico">📲</span>
    <div class="install-txt">
      <b>安装到主屏幕</b>

    </div>
    <button class="install-android btn sm" data-act="install-go" style="margin:0">安装</button>
    <button class="install-ios btn sm" data-act="install-go" style="margin:0;display:none">查看</button>
    <button class="install-x" data-act="install-x" aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>

  <script src="js/core-bridge.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/knowledge-tools.js"></script>

  <script src="js/recipe-imgs.js"></script>

</body>
